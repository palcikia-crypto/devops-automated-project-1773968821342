<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<title>Polymarket Lab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#070a12; --card:#111726; --card2:#161e30; --border:rgba(255,255,255,.08); --text:#e6edf3; --dim:#8b949e; --green:#3fb950; --red:#f85149; --blue:#58a6ff; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; padding:14px; padding-bottom:40px; max-width:760px; margin:0 auto; -webkit-tap-highlight-color:transparent; }
.hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.hd h1 { font-size:17px; font-weight:800; }
.nav { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:14px; }
.nav button { background:var(--card); border:1px solid var(--border); color:var(--dim); border-radius:10px; padding:10px 4px; font-family:inherit; font-size:11px; font-weight:600; cursor:pointer; }
.nav button.on { color:#fff; background:linear-gradient(135deg,#1f6feb,#a371f7); border-color:transparent; }
.view { display:none; } .view.on { display:block; }
.panel { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px; }
.panel h2 { font-size:13px; font-weight:700; margin-bottom:10px; }
</style>
</head>
<body>
<div class="hd"><h1>🔮 Polymarket Lab v1.5</h1><span style="color:var(--dim);font-weight:400;font-size:11px">Live Dashboard</span></div>
<div class="nav">
<button class="on" onclick="show('ov')">📊 Обзор</button>
<button onclick="show('sig')">🎯 Сигналы</button>
<button onclick="show('pf')">💰 Портфель</button>
<button onclick="show('sys')">⚙️ Система</button>
</div>
<div class="view on" id="v-ov">
  <div class="panel"><h2>📊 Polymarket Lab Работает!</h2>
    <p style="color:var(--dim);font-size:13px;">Это живая веб-панель для торговли на Polymarket.</p>
    <p style="color:var(--dim);font-size:11px;margin-top:10px;">Данные загружаются с: <code>davletovaalmira11-creator/polymarket-lab</code></p>
  </div>
</div>
<script>
function show(v) {
  document.querySelectorAll(".view").forEach(function (x) { x.classList.remove("on"); });
  document.getElementById("v-" + v).classList.add("on");
  document.querySelectorAll(".nav button").forEach(function (b, i) { b.classList.remove("on"); });
  event.currentTarget.classList.add("on");
}
</script>
</body>
</html>
